# Optional higher-frequency autonomous trigger.
# Vercel Hobby crons fire at most once/day; this fires every 6h for free.
# Setup: repo Settings → Secrets and variables → Actions →
#   INGEST_URL   = https://<your-deployment>.vercel.app
#   CRON_SECRET  = same value as the Vercel env var
name: ingest
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pipeline
        run: |
          curl -sf -X POST "$INGEST_URL/api/cron/ingest" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 290 | head -c 2000
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
